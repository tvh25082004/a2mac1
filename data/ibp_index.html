    <style>

        .loadingFond {
            position: fixed;
            top: 0;
            left: 0;
            background: #000000;
            z-index: 1;
            opacity: 1;
            display: block;
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        .loadingApp {
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            text-align: center;
        }

        .loadingLogo {
            padding: 10px;
            width: 400px;
        }

        .loadingFirst {
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 16px;
            font-style: normal;
            font-variant: normal;
            font-weight: 400;
            color: white;

    <script type="text/javascript">
        document.title = window.location.hostname + " - A2MAC1 Platform"

        /*
            Disable zone.js patching. Those variables must be set before loading zone.js.
        */
        __Zone_disable_requestAnimationFrame = false

        if (document['documentMode'] || /Edge/.test(navigator.userAgent))
        {
            __Zone_enable_cross_context_check = true;
            __Zone_disable_IE_check = true;
        }

        /*
            Check browser compatibility
        */
        var baseURI = document.getElementById("base").href;

        var Prerequisites = {

            isSupportedBrowser: function ()
            {
                var userAgent = window.navigator.userAgent;

                // Check Edge 85 or older
                if ((indexVersion = userAgent.indexOf("Edg/")) != -1)
                {
                    var objfullVersion = userAgent.substring(indexVersion + 4);
                    var majorVersion = objfullVersion.substring(0, objfullVersion.indexOf('.'));
                    if (majorVersion < 85)
                    {
                        return false;
                    }
                }
                // Check Chrome 85 or older
                else if ((indexVersion = userAgent.indexOf("Chrome")) != -1)
                {
                    var objfullVersion = userAgent.substring(indexVersion + 7);
                    var majorVersion = objfullVersion.substring(0, objfullVersion.indexOf('.'));
                    if (majorVersion < 85)
                    {
                        return false;
                    }
                }
                // Check IE 10 or older
                else if ((userAgent.indexOf("MSIE ")) != -1)
                {
                    return false;
                }
                // Check for IE 11
                else if (userAgent.indexOf("Trident/") != -1)
                {
                    return false;
                }
                // Check Firefox 79 or older
                else if ((indexVersion = userAgent.indexOf("Firefox")) != -1)
                {
                    var objfullVersion = userAgent.substring(indexVersion + 8);
                    var majorVersion = objfullVersion.substring(0, objfullVersion.indexOf('.'));
                    if (majorVersion < 79)
                    {
                        return false;
                    }
                }

                return true;
            }
        };

        if (!Prerequisites.isSupportedBrowser())
        {
            window.location = baseURI + "unsupported-browser.html";
        }

    </script>
